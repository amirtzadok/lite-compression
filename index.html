<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lite GIF by AmirTzadok</title>
  <script type="module" crossorigin src="/lite-compression/assets/index-x9vbShG5.js"></script>
  <link rel="stylesheet" crossorigin href="/lite-compression/assets/index-B_hySSvv.css">
</head>
<body>
  <div id="app">

    <header>
      <h1>Lite GIF by AmirTzadok</h1>
      <p class="tagline">Compress animated GIFs. Colors stay intact.</p>
    </header>

    <!-- Format tabs -->
    <div class="format-tabs" role="tablist">
      <button class="tab-btn active" data-tab="gif" role="tab" aria-selected="true">🎞 GIF</button>
      <button class="tab-btn" data-tab="png" role="tab" aria-selected="false">🖼 PNG</button>
    </div>

    <!-- Drop zone -->
    <div id="drop-zone" role="button" tabindex="0" aria-label="Drop file here or click to browse">
      <div class="drop-icon">📂</div>
      <p class="drop-text">Drop a <span id="drop-type-label">GIF</span> here, or <span class="browse-link">browse</span></p>
      <p class="drop-hint" id="drop-hint">Animated GIF · up to 50 MB</p>
      <input type="file" id="file-input" accept=".gif,image/gif" hidden />
    </div>

    <!-- Error message -->
    <div id="error-msg" class="error-msg" hidden></div>

    <!-- Controls + preview (hidden until file loaded) -->
    <section id="controls" hidden>

      <!-- Compression level selector -->
      <div class="level-section">
        <label class="section-label">Compression Level</label>
        <div class="level-buttons" role="group" aria-label="Compression level">
          <button class="level-btn" data-level="25">
            <span class="level-pct">25%</span>
            <span class="level-name">Light</span>
          </button>
          <button class="level-btn active" data-level="50">
            <span class="level-pct">50%</span>
            <span class="level-name">Medium</span>
          </button>
          <button class="level-btn" data-level="75">
            <span class="level-pct">75%</span>
            <span class="level-name">Strong</span>
          </button>
          <button class="level-btn" data-level="100">
            <span class="level-pct">100%</span>
            <span class="level-name">Max</span>
          </button>
        </div>
      </div>

      <!-- Before / After panels -->
      <div class="preview-panels">
        <div class="panel">
          <div class="panel-label">Original</div>
          <div class="panel-img-wrap">
            <img id="original-preview" alt="Original" />
          </div>
          <div class="panel-size" id="original-size"></div>
        </div>
        <div class="panel panel--compressed">
          <div class="panel-label">Compressed</div>
          <div class="panel-img-wrap">
            <img id="compressed-preview" alt="Compressed" />
            <div id="loading-overlay" class="loading-overlay" hidden>
              <div class="spinner"></div>
              <span>Compressing…</span>
            </div>
          </div>
          <div class="panel-size" id="compressed-size"></div>
        </div>
      </div>

      <!-- Download -->
      <button id="download-btn" class="download-btn" hidden>
        ⬇ Download Compressed File
      </button>

    </section>

  </div>

  <footer>© All rights reserved To AmirTzadok</footer>

</body>
</html>
